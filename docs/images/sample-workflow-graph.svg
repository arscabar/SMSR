<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">SMSR 작업 그래프 예시</title>
  <desc id="desc">에이전트, 작업 노드, 선택 작업 상세와 토큰 사용량을 보여주는 SMSR 대시보드 예시</desc>
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7185a4"/>
    </marker>
    <style>
      text{font-family:"Segoe UI","Malgun Gothic",sans-serif;fill:#eef5ff} .muted{fill:#93a9c7}.tiny{font-size:11px}.small{font-size:13px}.body{font-size:15px}.strong{font-weight:700}.chip{fill:#111c2c;stroke:#31435d}.card{fill:#141f30;stroke:#33445d}.node{fill:#162538;stroke-width:2}.success{stroke:#36b77b}.validation{stroke:#e2b84c}.active{stroke:#64a9ff}.line{stroke:#7185a4;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="680" rx="16" fill="#0d1522"/>
  <rect x="0" y="0" width="1200" height="64" rx="16" fill="#101b2b"/>
  <text x="22" y="38" font-size="20" class="strong">SMSR 작업 그래프 예시</text>

  <g transform="translate(366 16)">
    <rect width="132" height="32" rx="16" class="chip"/><circle cx="17" cy="16" r="5" fill="#45c88a"/>
    <text x="29" y="21" class="tiny strong">자동 갱신 연결됨</text>
  </g>
  <g transform="translate(506 16)"><rect width="205" height="32" rx="16" class="chip"/><text x="14" y="21" class="tiny strong">목표 작업 토큰 · IN 6.9M · OUT 18.1K</text></g>
  <g transform="translate(719 16)"><rect width="218" height="32" rx="16" class="chip"/><text x="14" y="21" class="tiny strong">그래프(추정) 토큰 · IN 211 · OUT 1.4K</text></g>
  <g transform="translate(945 16)"><rect width="142" height="32" rx="16" class="chip"/><text x="14" y="21" class="tiny strong">전체 진행률 75%</text></g>

  <g transform="translate(18 86)">
    <text x="0" y="0" class="body strong">에이전트</text>
    <rect x="0" y="16" width="238" height="166" rx="12" class="card"/>
    <text x="14" y="46" class="body strong">에이전트 01a0…95ba</text>
    <rect x="166" y="29" width="58" height="24" rx="12" fill="#644b25"/><text x="178" y="46" class="tiny strong">검증</text>
    <rect x="14" y="66" width="210" height="48" rx="8" fill="#0c1523"/>
    <text x="26" y="85" class="tiny muted">현재 담당</text><text x="26" y="104" class="small strong">v1.6.5 검증과 설치본 생성</text>
    <text x="14" y="139" class="tiny muted">역할</text><text x="14" y="160" class="small">검증</text>
    <text x="125" y="139" class="tiny muted">마지막 신호</text><text x="125" y="160" class="small">09:28:17</text>
  </g>

  <g transform="translate(282 86)">
    <text x="0" y="0" class="body strong">작업 흐름</text>
    <line x1="250" y1="105" x2="250" y2="135" class="line"/><line x1="250" y1="225" x2="250" y2="255" class="line"/><line x1="250" y1="345" x2="250" y2="375" class="line"/>
    <g transform="translate(85 18)"><rect width="330" height="88" rx="12" class="node success"/><text x="18" y="29" class="body strong">대시보드 토큰 UI 정리</text><text x="18" y="52" class="small muted">dashboard-cleanup · SUCCESS</text><text x="18" y="73" class="small" fill="#54c98e">진행 100%</text></g>
    <g transform="translate(85 138)"><rect width="330" height="88" rx="12" class="node success"/><text x="18" y="29" class="body strong">펫 더블클릭 완료 확인</text><text x="18" y="52" class="small muted">pet-double-click · SUCCESS</text><text x="18" y="73" class="small" fill="#54c98e">진행 100%</text></g>
    <g transform="translate(85 258)"><rect width="330" height="88" rx="12" class="node validation"/><text x="18" y="29" class="body strong">v1.6.5 검증과 설치본 생성</text><text x="18" y="52" class="small muted">release-validation · SUCCESS</text><text x="18" y="73" class="small" fill="#e2b84c">검증 완료</text></g>
    <g transform="translate(85 378)" filter="url(#glow)"><rect width="330" height="88" rx="12" class="node active"/><text x="18" y="29" class="body strong">v1.6.5 커밋·푸시·릴리스 게시</text><text x="18" y="52" class="small muted">release-publish · IN_PROGRESS</text><text x="18" y="73" class="small" fill="#64a9ff">진행 75%</text></g>
  </g>

  <g transform="translate(816 86)">
    <text x="0" y="0" class="body strong">작업 상세</text>
    <rect x="0" y="16" width="366" height="244" rx="12" class="card"/>
    <text x="18" y="46" class="tiny muted">작업</text><text x="18" y="72" class="body strong">v1.6.5 커밋·푸시·릴리스 게시</text>
    <text x="18" y="105" class="tiny muted">상태 / 진행률</text><text x="18" y="128" class="body">진행 중 · 75%</text>
    <text x="18" y="160" class="tiny muted">담당 / 역할</text><text x="18" y="183" class="body">01a0a2e0…95ba · release</text>
    <text x="18" y="215" class="tiny muted">완료 결과</text><text x="18" y="238" class="small">설치본과 체크섬을 GitHub Release에 게시</text>

    <rect x="0" y="280" width="366" height="160" rx="12" class="card"/>
    <text x="18" y="310" class="body strong">목표 작업 토큰</text>
    <line x1="18" y1="325" x2="348" y2="325" stroke="#33445d"/>
    <text x="18" y="350" class="small muted">신규 입력</text><text x="346" y="350" text-anchor="end" class="small strong">284.2K</text>
    <text x="18" y="380" class="small muted">캐시 입력</text><text x="346" y="380" text-anchor="end" class="small strong">6.6M</text>
    <text x="18" y="410" class="small muted">출력</text><text x="346" y="410" text-anchor="end" class="small strong">18.1K</text>
  </g>

  <text x="22" y="650" class="small muted">상태 색상: 완료</text><circle cx="130" cy="646" r="5" fill="#36b77b"/><text x="147" y="650" class="small muted">검증</text><circle cx="190" cy="646" r="5" fill="#e2b84c"/><text x="207" y="650" class="small muted">진행 중</text><circle cx="270" cy="646" r="5" fill="#64a9ff"/>
</svg>
